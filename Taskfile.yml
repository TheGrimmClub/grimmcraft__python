# https://taskfile.dev
#
# Root orchestrator for the grimmcraft Python monorepo (uv workspace).
#
# Aggregate tasks (install/test/lint/typecheck/build/...) operate across the
# whole workspace and auto-discover packages under packages/* — no edits here
# when you add a package.
#
# Per-package tasks are exposed via the includes below, e.g. `task core:test`
# or `task cli:run -- Grimm`.

version: '3'

env:
  # `uv run` auto-syncs before every command, which re-applies the iCloud
  # UF_HIDDEN flag to the editable .pth files (see `fix-venv`). Disable the
  # implicit sync so syncing only happens through `task install`, which clears
  # the flag afterwards. Run `task install` when dependencies change.
  UV_NO_SYNC: "1"

vars:
  # Auto-discovered list of package directory names under packages/.
  PACKAGES:
    sh: ls -d packages/*/ | xargs -n1 basename

includes:
  core:
    taskfile: ./packages/grimmcraft-core/Taskfile.yml
    dir: ./packages/grimmcraft-core
  cli:
    taskfile: ./packages/grimmcraft-cli/Taskfile.yml
    dir: ./packages/grimmcraft-cli
  data:
    taskfile: ./packages/grimmcraft-data/Taskfile.yaml
    dir: ./packages/grimmcraft-data
  control:
    taskfile: ./packages/grimmcraft-control/Taskfile.yml
    dir: ./packages/grimmcraft-control
  club:
    taskfile: ./packages/grimmclub/Taskfile.yml
    dir: ./packages/grimmclub
  compiler:
    taskfile: ./packages/grimmcraft-compiler/Taskfile.yml
    dir: ./packages/grimmcraft-compiler
  redstone:
    taskfile: ./packages/grimmcraft-redstone/Taskfile.yml
    dir: ./packages/grimmcraft-redstone
  decompiler:
    taskfile: ./packages/grimmcraft-decompiler/Taskfile.yml
    dir: ./packages/grimmcraft-decompiler
  stdlib:
    taskfile: ./packages/grimmclub-standardlib/Taskfile.yml
    dir: ./packages/grimmclub-standardlib
  diagnostics:
    taskfile: ./packages/grimmclub-diagnostics/Taskfile.yml
    dir: ./packages/grimmclub-diagnostics
  mentor:
    taskfile: ./packages/grimmclub-mentor/Taskfile.yml
    dir: ./packages/grimmclub-mentor
  fs:
    taskfile: ./packages/grimmclub-filesystem/Taskfile.yml
    dir: ./packages/grimmclub-filesystem
  world:
    taskfile: ./packages/grimmcraft-world/Taskfile.yml
    dir: ./packages/grimmcraft-world
  structures:
    taskfile: ./packages/grimmcraft-structures/Taskfile.yml
    dir: ./packages/grimmcraft-structures
  npc:
    taskfile: ./packages/grimmcraft-npc/Taskfile.yml
    dir: ./packages/grimmcraft-npc
  migrate:
    taskfile: ./packages/grimmcraft-migrate/Taskfile.yml
    dir: ./packages/grimmcraft-migrate
  examples:
    taskfile: ./packages/grimmcraft-examples/Taskfile.yml
    dir: ./packages/grimmcraft-examples

tasks:
  default:
    cmds:
      - task --list

  install:
    desc: Sync the whole workspace (all packages + dev tools) into .venv
    cmds:
      - uv sync --all-packages
      # This repo lives under an iCloud-synced folder (~/Desktop), which sets the
      # macOS UF_HIDDEN flag on files it touches. CPython's site.py silently skips
      # *hidden* .pth files, so the editable workspace packages would not import.
      # Clear the flag on every sync so the .pth files are honored at startup.
      - task: fix-venv

  fix-venv:
    desc: Clear the macOS 'hidden' flag off editable .pth files (iCloud workaround)
    cmds:
      - "chflags nohidden .venv/lib/python*/site-packages/*.pth 2>/dev/null || true"

  test:
    desc: Run tests for every package (auto-discovers packages/*/tests)
    deps: [fix-venv]
    cmds:
      - uv run pytest packages

  lint:
    desc: Lint the entire workspace
    cmds:
      - uv run ruff check .

  format:
    desc: Auto-format the entire workspace
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  typecheck:
    desc: Type-check every package
    cmds:
      - for: { var: PACKAGES }
        cmd: uv run mypy packages/{{.ITEM}}/srcs

  build:
    desc: Build wheels + sdists for every package into dist/
    cmds:
      - uv build --all-packages

  check:
    desc: Run lint, typecheck, and tests (what CI runs)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  statistics:
    desc: 'Per-package size, shape, tests and docs (usage: task statistics -- --facts)'
    silent: true
    cmds:
      # Standard library only, so it needs no venv and works on a fresh clone.
      - python3 tools/statistics.py {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts and tooling caches
    cmds:
      - rm -rf dist build
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - rm -rf .pytest_cache .ruff_cache .mypy_cache

  new-filetype:
    desc: 'Add a FileType + its expect_ guard (usage: task new-filetype -- YAML --value 102 --suffixes .yaml,.yml)'
    silent: true
    cmds:
      # Standard library only, so it needs no venv.
      - python3 tools/new_file_type.py {{.CLI_ARGS}}

  new-package:
    desc: 'Scaffold a new workspace package (usage: task new-package -- <name>)'
    cmds:
      - uv init --package --lib --build-backend uv --name {{.CLI_ARGS}} packages/{{.CLI_ARGS}}
      - mkdir -p packages/{{.CLI_ARGS}}/srcs/{{.CLI_ARGS | replace "-" "_"}} packages/{{.CLI_ARGS}}/tests
      - rm -rf packages/{{.CLI_ARGS}}/src
      - cmd: echo "Created packages/{{.CLI_ARGS}} - set module-root='srcs' in its pyproject and add an 'includes' entry here to expose per-package tasks."
        silent: true
