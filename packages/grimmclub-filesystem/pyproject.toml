[project]
name = "grimmclub-filesystem"
version = "2026.2.0"
description = "The one interface to os, pathlib, zip, ftp/http Grimm"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "grimmclub-standardlib",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Package sources live under srcs/ (not the uv default src/).
module-root = "srcs"

# Resolve sibling packages from the local workspace instead of an index.
[tool.uv.sources]
grimmclub-standardlib = { workspace = true }
