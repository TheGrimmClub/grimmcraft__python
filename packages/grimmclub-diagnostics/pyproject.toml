[project]
name = "grimmclub-diagnostics"
version = "0.1.0"
description = "Stable diagnostic codes, severities and readable reports"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
# `rich` only, for the report. Deliberately no grimmcraft dependency: this
# package must not learn what any domain's codes mean.
dependencies = [
    "rich>=13.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "srcs"
