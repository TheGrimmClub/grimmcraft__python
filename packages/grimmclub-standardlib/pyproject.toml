[project]
name = "grimmclub-standardlib"
version = "0.1.0"
description = "A curated facade over the Python standard library, with logging helpers"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
# Deliberately empty, and it must stay that way: this package sits at the bottom
# of the grimmclub stack, so anything may depend on it.
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "srcs"
