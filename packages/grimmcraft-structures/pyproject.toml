[project]
name = "grimmcraft-structures"
version = "0.1.0"
description = "Save and restore Minecraft structures (.nbt templates) for grimmcraft datapacks"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "grimmcraft-core",
    "grimmcraft-control",
    "grimmcraft-world",
    "grimmclub-filesystem",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
grimmcraft-structure = "grimmcraft_structures.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Package sources live under srcs/ (not the uv default src/).
module-root = "srcs"

# Resolve sibling packages from the local workspace instead of an index.
[tool.uv.sources]
grimmcraft-core = { workspace = true }
grimmcraft-control = { workspace = true }
grimmcraft-world = { workspace = true }
grimmclub-filesystem = { workspace = true }
