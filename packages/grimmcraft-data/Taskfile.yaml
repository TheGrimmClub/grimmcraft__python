# https://taskfile.dev
#
# Root orchestrator for the grimmcraft Python monorepo (uv workspace).
#
# Aggregate tasks (install/test/lint/typecheck/build/...) operate across the
# whole workspace and auto-discover packages under packages/* — no edits here
# when you add a package.
#
# Per-package tasks are exposed via the includes below, e.g. `task core:test`
# or `task cli:run -- Grimm`.

version: '3'

vars:
    VERSION: "2026.0.1"

tasks:
    default:
      desc: List available tasks
      cmds:
        - task --list

    test:
      desc: Run the grimmcraft-data test suite
      cmds:
        - uv run pytest packages/grimmcraft-data/tests -q

    generate-blocks-enum:
      desc: Generate the Minecraft block enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/blocks.py

    generate-effects-enum:
      desc: Generate the Minecraft effect enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/effects.py

    generate-entities-enum:
      desc: Generate the Minecraft entity enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/entities.py

    generate-foods-enum:
      desc: Generate the Minecraft food enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/foods.py

    generate-instruments-enum:
      desc: Generate the Minecraft instrument enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/instruments.py

    generate-items-enum:
      desc: Generate the Minecraft item enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/items.py

    generate-particles-enum:
      desc: Generate the Minecraft particle enum from PrismarineJS/minecraft-data
      cmds:
        - uv run srcs/grimmcraft_data/_generate/particles.py

    generate-base-enums:
      desc: Generate all Minecraft enums from PrismarineJS/minecraft-data
      cmds:
        - task generate-blocks-enum
        - task generate-effects-enum
        - task generate-entities-enum
        - task generate-foods-enum
        - task generate-instruments-enum
        - task generate-items-enum
        - task generate-particles-enum

    generate-recipe-data:
      desc: Bundle crafting recipes and generate the recipe accessor module
      cmds:
        - uv run srcs/grimmcraft_data/_generate/advanced_recipe.py

    generate-loot-data:
      desc: Bundle block/entity loot tables and generate the loot accessor module
      cmds:
        - uv run srcs/grimmcraft_data/_generate/advanced_loot.py

    generate-collision-shape-data:
      desc: Bundle block collision shapes and generate the collision_shape module
      cmds:
        - uv run srcs/grimmcraft_data/_generate/advanced_collision_shape.py

    generate-attribute-data:
      desc: Generate the inlined entity attribute registry module
      cmds:
        - uv run srcs/grimmcraft_data/_generate/advanced_attribute.py

    generate-language-data:
      desc: Bundle the en_us translation table and generate the language module
      cmds:
        - uv run srcs/grimmcraft_data/_generate/advanced_language.py

    generate-registry-enums:
      desc: >-
        Generate exhaustive registry enums from a local Mojang reports/registries.json
        (override the path with REGISTRIES=/path/to/registries.json)
      vars:
        REGISTRIES: '{{.REGISTRIES | default "registries.json"}}'
      cmds:
        - cmd: |
            if [ -f "{{.REGISTRIES}}" ]; then
              uv run srcs/grimmcraft_data/_generate/advanced_registry.py --input "{{.REGISTRIES}}"
            else
              echo "skip generate-registry-enums: {{.REGISTRIES}} not found."
              echo "Generate it with the Mojang server report, then re-run with"
              echo "  task data:generate-registry-enums REGISTRIES=/path/to/registries.json"
            fi

    generate-advanced-data:
      desc: Regenerate all advanced Minecraft data modules (recipes, loot, registries, …)
      cmds:
        - task generate-recipe-data
        - task generate-loot-data
        - task generate-collision-shape-data
        - task generate-attribute-data
        - task generate-language-data
        - task generate-registry-enums
