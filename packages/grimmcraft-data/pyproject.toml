[project]
name = "grimmcraft-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Package sources live under srcs/ (not the uv default src/).
module-root = "srcs"
# Ship the bundled minecraft-data JSON assets and the py.typed marker.
source-include = ["srcs/grimmcraft_data/data/**/*.json"]
wheel-exclude = ["**/__pycache__", "_generate"]
