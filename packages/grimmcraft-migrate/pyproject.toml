[project]
name = "grimmcraft-migrate"
version = "0.1.0"
description = "Migrate Minecraft command strings from 1.19 syntax to 1.21 syntax"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
# Deliberately empty: this package is standard-library only, so it can be
# lifted out of the workspace and run anywhere on a bare Python.
dependencies = []

[project.scripts]
grimmcraft-migrate = "grimmcraft_migrate.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "srcs"
