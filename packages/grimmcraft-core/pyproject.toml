[project]
name = "grimmcraft-core"
version = "0.1.0"
description = "Core library shared across grimmcraft packages"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Package sources live under srcs/ (not the uv default src/).
module-root = "srcs"
