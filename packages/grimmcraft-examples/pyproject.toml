[project]
name = "grimmcraft-examples"
version = "0.1.0"
description = "Runnable examples for every grimmcraft package, and the datapacks they generate"
readme = "README.md"
authors = [
    { name = "Andreas **Felix** Häberle", email = "felix@42sol.eu" }
]
requires-python = ">=3.12"
# Examples are the one place a cross-package workflow is legitimate — capture a
# structure, place it from a machine, compile it, decompile it back — so this
# package depends on everything it demonstrates. Keeping them here means each
# library package's own dependencies stay honest.
dependencies = [
    "grimmclub",
    "grimmcraft-core",
    "grimmcraft-data",
    "grimmcraft-control",
    "grimmcraft-compiler",
    "grimmcraft-decompiler",
    "grimmcraft-redstone",
    "grimmcraft-structures",
    "grimmcraft-npc",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "srcs"

[tool.uv.sources]
grimmclub = { workspace = true }
grimmcraft-core = { workspace = true }
grimmcraft-data = { workspace = true }
grimmcraft-control = { workspace = true }
grimmcraft-compiler = { workspace = true }
grimmcraft-decompiler = { workspace = true }
grimmcraft-redstone = { workspace = true }
grimmcraft-structures = { workspace = true }
grimmcraft-npc = { workspace = true }
