[project]
name = "grimmcraft-cli"
version = "0.1.0"
description = "Command-line app built on grimmcraft-core"
requires-python = ">=3.11"
dependencies = [
    "grimmcraft-core",
]

[project.scripts]
grimm = "grimm_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["srcs/grimmcraftcraft_cli"]

# Resolve grimmcraft-core from the local workspace instead of an index.
[tool.uv.sources]
grimmcraft-core = { workspace = true }
