[project]
name = "grimmcraft-cli"
version = "0.1.0"
description = "Command-line app built on grimmcraft-core"
requires-python = ">=3.12"
dependencies = [
    "grimmcraft-core",
]

[project.scripts]
grimmcraft = "grimmcraft_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Package sources live under srcs/ (not the uv default src/).
module-root = "srcs"

# Resolve grimmcraft-core from the local workspace instead of an index.
[tool.uv.sources]
grimmcraft-core = { workspace = true }
