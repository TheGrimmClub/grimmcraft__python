# Per-package tasks for grimmcraft-cli.
# Included by the root Taskfile as the `cli:` namespace, and reusable
# standalone: run `task` from inside this directory.
version: '3'

vars:
  PKG: grimmcraft-cli

tasks:
  default:
    cmds:
      - task: test

  test:
    desc: Run this package's tests
    cmds:
      - uv run --package {{.PKG}} pytest tests

  lint:
    desc: Lint this package
    cmds:
      - uv run ruff check srcs tests

  typecheck:
    desc: Type-check this package
    cmds:
      - uv run mypy srcs

  build:
    desc: Build wheel + sdist for this package
    cmds:
      - uv build --package {{.PKG}}

  run:
    desc: Run the grimmcraft CLI (pass args after --)
    cmds:
      - uv run --package {{.PKG}} grimmcraft {{.CLI_ARGS}}
