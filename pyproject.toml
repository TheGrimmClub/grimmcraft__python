# Workspace root (virtual project — not itself a distributable package).
# Individual packages live under packages/* and are wired together as a
# uv workspace sharing a single lockfile and virtualenv.

[tool.uv.workspace]
members = ["packages/*"]

# Dev tooling shared by every package in the workspace.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML",       # stubs for grimmclub-filesystem's yaml config loader
    "pyftpdlib>=1.5",     # local FTP server exercising the transfer download path
]

[tool.ruff]
line-length = 100
src = ["packages/*/srcs", "packages/*/tests"]
# Datapack fixtures are test *data*, not source: the .py files inside them are
# the generator scripts that shipped with the pack and are linted by nobody.
#
# grimmoire is a git submodule holding the teaching materials — another repo,
# with its own rules. Its snippets are lesson content (deliberately imperfect,
# built up step by step), so linting them here would be both wrong and noisy.
extend-exclude = ["**/tests/**/datapacks/**", "grimmoire/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# grimmcraft-data's registry modules are generated from PrismarineJS
# minecraft-data and carry "do not edit by hand; regenerate with _generate/".
# A row is one registry entry — a namespaced id plus a display name — which
# simply does not fit in 100 columns:
#
#   EXPOSED_CHISELED_COPPER = (99, "minecraft:exposed_chiseled_copper", "Exposed Chiseled Copper", 64)
#
# Wrapping 1505 of those would obscure the one-row-per-entry shape and be undone
# by the next regeneration, so the line limit is not meaningful here. The
# hand-written generators under _generate/ are deliberately still linted.
"packages/grimmcraft-data/srcs/grimmcraft_data/*.py" = ["E501"]

# grimmclub is a *facade*: `from grimmclub._core import *` re-exporting
# yes/no/true/false/on/off is the whole point of the module, and those names are
# then listed in __all__. F403 ("unable to detect undefined names") and F405
# ("may be undefined, or defined from star imports") are therefore reporting the
# design working, not a problem — the one place a star import is deliberate.
"packages/grimmclub/srcs/grimmclub/__init__.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
strict = true
# Resolve sibling workspace packages from source (editable installs use .pth
# files, which mypy does not process). Mirrors the ruff `src` setting above.
mypy_path = [
    "packages/grimmclub/srcs",
    "packages/grimmclub-filesystem/srcs",
    "packages/grimmcraft-world/srcs",
    "packages/grimmcraft-data/srcs",
    "packages/grimmcraft-core/srcs",
    "packages/grimmcraft-control/srcs",
    "packages/grimmcraft-compiler/srcs",
    "packages/grimmcraft-cli/srcs",
    "packages/grimmcraft-decompiler/srcs",
    "packages/grimmcraft-structures/srcs",
    "packages/grimmcraft-npc/srcs",
    "packages/grimmcraft-migrate/srcs",
    "packages/grimmcraft-examples/srcs",
]

# grimmcraft-data is generated (and not strict-typed); type-check *against* its
# public types but don't report errors inside it when a downstream package pulls
# it in.
[[tool.mypy.overrides]]
module = ["grimmcraft_data.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
# importlib mode lets sibling packages share test-file basenames (e.g. several
# packages each having tests/test_diagnostics.py) without import collisions.
addopts = "-ra --import-mode=importlib"
# Never collect from the grimmoire submodule: it is another repo's teaching
# material, not this workspace's tests.
norecursedirs = ["grimmoire", ".venv", "dist", "build"]
